[project]
name = "qhttpserver"
version = "0.1.0"
description = "An http server to work with PyQt6 event loop. Built using QTcpServer"
authors = [
    {name = "Srpboyz",email = "srpboyz69@gmail.com"}
]
requires-python = ">=3.14"
